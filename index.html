
  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FitWater 💧</title>
  <style>
    body {
      background-color: #e2e8f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0 0 100px 0;
      color: #334155;
    }

    .header {
      background-color: #0284c7;
      color: white;
      text-align: center;
      padding: 20px 10px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 15px;
    }

    .card {
      background-color: #f8fafc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid #cbd5e1;
    }

    .card h2 {
      margin-top: 0;
      text-align: center;
      color: #0284c7;
      font-size: 20px;
    }

    .btn-blue {
      background-color: #38bdf8;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-blue:hover {
      background-color: #0284c7;
    }

    .btn-red {
      background-color: #f87171;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Selector de Actividades */
    .selector-actividad-box {
      background-color: #ffffff;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .desplegable-select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #0284c7;
      background-color: #f0f9ff;
      color: #0369a1;
      font-weight: bold;
      font-size: 14px;
      width: 100%;
      max-width: 300px;
      cursor: pointer;
    }

    .inputs-actividad {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .inputs-actividad input {
      width: 70px;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-align: center;
    }

    /* Peso Corporal (Ahora ubicado justo abajo) */
    .peso-box {
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px dashed #94a3b8;
    }

    .peso-box input {
      padding: 6px;
      width: 60px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    /* Sección Agua */
    .agua-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-custom-box {
      background-color: #ffffff;
      padding: 10px;
      border-radius: 12px;
      border: 1px dashed #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-custom-box input {
      padding: 6px;
      width: 80px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    /* Vaso */
    .vaso-area {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 280px;
      position: relative;
    }

    .vaso {
      border: 4px solid #0284c7;
      border-top: none;
      border-radius: 0 0 16px 16px;
      position: relative;
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: flex-end;
    }

    .vaso.grande { width: 110px; height: 240px; }
    .vaso.pequeno { width: 70px; height: 80px; }

    .contenido-agua {
      background-color: #38bdf8;
      width: 100%;
      height: 0%;
      border-radius: 0 0 12px 12px;
      transition: height 0.3s ease;
    }

    .desbordado::after {
      content: '';
      position: absolute;
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -12px;
      background-color: rgba(56, 189, 248, 0.5);
      border-radius: 20px;
      border: 3px dashed #0284c7;
      pointer-events: none;
    }

    /* Resultados Fijos */
    .resultados-fijos {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1e3a8a;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    .res-item {
      text-align: center;
    }

    .res-item span {
      display: block;
      font-size: 18px;
      font-weight: bold;
    }

    .consultas-lista {
      font-size: 12px;
      max-height: 40px;
      overflow-y: auto;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>FitWater 💧</h1>
    <p>Información e indicadores de hidratación y actividad física</p>
  </div>

  <div class="container">

    <!-- 1. ACTIVIDAD FÍSICA -->
    <div class="card">
      <h2>Calculadora de Actividad Física</h2>
      
      <!-- Menú desplegable para elegir la actividad -->
      <div class="selector-actividad-box">
        <label for="selectActividades">Selecciona una actividad:</label>
        <select id="selectActividades" class="desplegable-select" onchange="cambiarUnidadEtiqueta()">
          <!-- Se llenan automáticamente con JS -->
        </select>

        <div class="inputs-actividad">
          <input type="number" id="cantInput" placeholder="Cant." value="10" min="1">
          <span id="unidadTexto">min/reps</span>
          <button class="btn-blue" onclick="agregarActividadSeleccionada()">Elegir Actividad</button>
        </div>
      </div>

      <!-- Determinar Calorías y Peso Corporal (Ubicado justo abajo) -->
      <div class="peso-box">
        <label for="peso">Peso Corporal de Referencia:</label>
        <input type="number" id="peso" value="70">
        <span>kg</span>
        <button class="btn-blue" onclick="determinarCalorias()">Determinar Calorías</button>
      </div>
    </div>

    <!-- 2. REGISTRO DE AGUA -->
    <div class="card">
      <h2>Información y Capacidad del Recipiente de Agua</h2>
      
      <div class="agua-controls">
        <div class="btn-group">
          <button class="btn-blue" onclick="cambiarBotella(250)">Vaso (250 ml)</button>
          <button class="btn-blue" onclick="cambiarBotella(2000)">Botella Fuerza (2000 ml)</button>
        </div>

        <div class="input-custom-box">
          <input type="number" id="inputMl" placeholder="Ej. 200">
          <button class="btn-blue" onclick="modificarAgua(true)">+ Sumar</button>
          <button class="btn-red" onclick="modificarAgua(false)">- Restar</button>
          <button class="btn-blue" style="background-color: #64748b;" onclick="reiniciarAgua()">Vaciar</button>
        </div>
      </div>

      <div class="vaso-area">
        <div id="vaso" class="vaso grande">
          <div id="agua" class="contenido-agua"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- RESULTADOS FIJOS ABAJO -->
  <div class="resultados-fijos">
    <div class="res-item">
      <div>Calorías Calculadas</div>
      <span id="totalCalorias">0 kcal</span>
    </div>
    <div class="res-item">
      <div>Registro de Consultas</div>
      <div class="consultas-lista" id="listaConsultas">Ninguna</div>
    </div>
  </div>

  <script>
    const actividades = [
      { id: 1, nombre: "Caminar", unidad: "min", calPorUnidad: 4 },
      { id: 2, nombre: "Correr", unidad: "min", calPorUnidad: 10 },
      { id: 3, nombre: "Ciclismo", unidad: "min", calPorUnidad: 8 },
      { id: 4, nombre: "Natación", unidad: "min", calPorUnidad: 8 },
      { id: 5, nombre: "Saltar Cuerda", unidad: "min", calPorUnidad: 13 },
      { id: 6, nombre: "Flexiones", unidad: "reps", calPorUnidad: 1 },
      { id: 7, nombre: "Sentadillas", unidad: "reps", calPorUnidad: 1.2 },
      { id: 8, nombre: "Abdominales", unidad: "reps", calPorUnidad: 0.8 },
      { id: 9, nombre: "Yoga", unidad: "min", calPorUnidad: 2.5 },
      { id: 10, nombre: "Pilates", unidad: "min", calPorUnidad: 3.3 },
      { id: 11, nombre: "Zumba", unidad: "min", calPorUnidad: 6.6 },
      { id: 12, nombre: "Boxeo", unidad: "min", calPorUnidad: 10.6 },
      { id: 13, nombre: "Escalar", unidad: "min", calPorUnidad: 9.3 },
      { id: 14, nombre: "Remo", unidad: "min", calPorUnidad: 7 },
      { id: 15, nombre: "Trote suave", unidad: "min", calPorUnidad: 8 },
      { id: 16, nombre: "Pasear perro", unidad: "min", calPorUnidad: 3 },
      { id: 17, nombre: "Fútbol", unidad: "min", calPorUnidad: 8.3 },
      { id: 18, nombre: "Baloncesto", unidad: "min", calPorUnidad: 8.4 },
      { id: 19, nombre: "Tenis", unidad: "min", calPorUnidad: 6.8 },
      { id: 20, nombre: "Voleibol", unidad: "min", calPorUnidad: 4.4 },
      { id: 21, nombre: "Crossfit", unidad: "min", calPorUnidad: 11.6 },
      { id: 22, nombre: "Patinaje", unidad: "min", calPorUnidad: 7.3 },
      { id: 23, nombre: "Bailar", unidad: "min", calPorUnidad: 6 },
      { id: 24, nombre: "Burpees", unidad: "reps", calPorUnidad: 2.3 },
      { id: 25, nombre: "Zancadas", unidad: "reps", calPorUnidad: 1.25 },
      { id: 26, nombre: "Plancha", unidad: "min", calPorUnidad: 6 },
      { id: 27, nombre: "Spinning", unidad: "min", calPorUnidad: 9.3 },
      { id: 28, nombre: "Senderismo", unidad: "min", calPorUnidad: 6 },
      { id: 29, nombre: "Karate", unidad: "min", calPorUnidad: 7.3 },
      { id: 30, nombre: "Gimnasia", unidad: "min", calPorUnidad: 5.3 }
    ];

    let totalCalorias = 0;
    let consultas = [];
    let capacidadMax = 2000;
    let mlActuales = 0;

    const select = document.getElementById('selectActividades');
    actividades.forEach(act => {
      const option = document.createElement('option');
      option.value = act.id;
      option.textContent = act.nombre;
      select.appendChild(option);
    });

    function cambiarUnidadEtiqueta() {
      const selectedId = parseInt(select.value);
      const act = actividades.find(a => a.id === selectedId);
      document.getElementById('unidadTexto').innerText = act.unidad;
    }

    cambiarUnidadEtiqueta();

    function agregarActividadSeleccionada() {
      const selectedId = parseInt(select.value);
      const act = actividades.find(a => a.id === selectedId);
      const cantidad = parseFloat(document.getElementById('cantInput').value);

      if (cantidad > 0) {
        const calCalculadas = Math.round(cantidad * act.calPorUnidad);
        totalCalorias += calCalculadas;
        // Guarda la actividad con el tiempo/reps exacto seleccionado
        consultas.push(`${act.nombre} (${cantidad} ${act.unidad} = ${calCalculadas} kcal)`);
        actualizarResultados();
      }
    }

    function determinarCalorias() {
      const peso = parseFloat(document.getElementById('peso').value);
      if (peso > 0) {
        alert(`Para tu peso de ${peso} kg, tus calorías base recomendadas son aprox. ${Math.round(peso * 22)} kcal`);
      }
    }

    function actualizarResultados() {
      document.getElementById('totalCalorias').innerText = totalCalorias + " kcal";
      const lista = document.getElementById('listaConsultas');
      lista.innerHTML = consultas.length ? consultas.join(' | ') : 'Ninguna';
    }

    function cambiarBotella(cap) {
      capacidadMax = cap;
      const vaso = document.getElementById('vaso');
      vaso.className = cap === 250 ? 'vaso pequeno' : 'vaso grande';
      actualizarAguaVisual();
    }

    function modificarAgua(esSuma) {
      const input = document.getElementById('inputMl');
      const cantidad = parseFloat(input.value);
      if (cantidad > 0) {
        if (esSuma) {
          mlActuales += cantidad;
        } else {
          mlActuales = Math.max(0, mlActuales - cantidad);
        }
        actualizarAguaVisual();
        input.value = '';
      }
    }

    function reiniciarAgua() {
      mlActuales = 0;
      actualizarAguaVisual();
    }

    function actualizarAguaVisual() {
      const agua = document.getElementById('agua');
      const vaso = document.getElementById('vaso');
      let pct = (mlActuales / capacidadMax) * 100;

      if (pct > 100) {
        agua.style.height = '100%';
        vaso.classList.add('desbordado');
      } else {
        agua.style.height = pct + '%';
        vaso.classList.remove('desbordado');
      }
    }
  </script>
</body>
</html>
