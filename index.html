<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FitWater 💧</title>
  <style>
    body {
      background-color: #e2e8f0;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0 0 100px 0;
      color: #334155;
    }

    /* Enzabezado principal */
    .header {
      background-color: #0284c7;
      color: white;
      text-align: center;
      padding: 20px 10px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 5px 0 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 15px;
    }

    .card {
      background-color: #f8fafc;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid #cbd5e1;
    }

    .card h2 {
      margin-top: 0;
      text-align: center;
      color: #0284c7;
      font-size: 20px;
    }

    /* Botones */
    .btn-blue {
      background-color: #38bdf8;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-blue:hover {
      background-color: #0284c7;
    }

    .btn-red {
      background-color: #f87171;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 1. Actividad Física y Peso Corporal */
    .peso-box {
      background-color: #ffffff;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px dashed #94a3b8;
    }

    .peso-box input {
      padding: 6px;
      width: 60px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    .grid-actividades {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding: 5px;
    }

    .actividad-item {
      background-color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    /* 2. Sección Agua */
    .agua-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .input-custom-box {
      background-color: #ffffff;
      padding: 10px;
      border-radius: 12px;
      border: 1px dashed #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-custom-box input {
      padding: 6px;
      width: 80px;
      text-align: center;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }

    /* Vaso y Desbordamiento */
    .vaso-area {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 280px;
      position: relative;
    }

    .vaso {
      border: 4px solid #0284c7;
      border-top: none;
      border-radius: 0 0 16px 16px;
      position: relative;
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: flex-end;
    }

    /* 250ml mide un tercio del de 2000ml */
    .vaso.grande { width: 110px; height: 240px; }
    .vaso.pequeno { width: 70px; height: 80px; }

    .contenido-agua {
      background-color: #38bdf8;
      width: 100%;
      height: 0%;
      border-radius: 0 0 12px 12px;
      transition: height 0.3s ease;
    }

    /* Efecto de desbordamiento notable */
    .desbordado::after {
      content: '';
      position: absolute;
      top: -20px;
      left: -20px;
      right: -20px;
      bottom: -12px;
      background-color: rgba(56, 189, 248, 0.5);
      border-radius: 20px;
      border: 3px dashed #0284c7;
      pointer-events: none;
    }

    /* 3. Resultados fijos abajo */
    .resultados-fijos {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1e3a8a;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.15);
      z-index: 1000;
    }

    .res-item {
      text-align: center;
    }

    .res-item span {
      display: block;
      font-size: 18px;
      font-weight: bold;
    }

    .consultas-lista {
      font-size: 12px;
      max-height: 35px;
      overflow-y: auto;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <div class="header">
    <h1>FitWater 💧</h1>
    <p>Información e indicadores de hidratación y actividad física</p>
  </div>

  <div class="container">

    <!-- 1. Actividad Física (Primero) -->
    <div class="card">
      <h2>Calculadora de Actividad Física</h2>
      
      <!-- Peso dentro de actividad física -->
      <div class="peso-box">
        <label for="peso">Peso Corporal de Referencia:</label>
        <input type="number" id="peso" value="70">
        <span>kg</span>
        <button class="btn-blue" onclick="determinarCalorias()">Determinar Calorías</button>
      </div>

      <!-- 30 Actividades -->
      <div class="grid-actividades" id="gridActividades"></div>
    </div>

    <!-- 2. Registro de Agua (Al final) -->
    <div class="card">
      <h2>Información y Capacidad del Recipiente de Agua</h2>
      
      <div class="agua-controls">
        <div class="btn-group">
          <button class="btn-blue" onclick="cambiarBotella(250)">Vaso (250 ml)</button>
          <button class="btn-blue" onclick="cambiarBotella(2000)">Botella Fuerza (2000 ml)</button>
        </div>

        <div class="input-custom-box">
          <input type="number" id="inputMl" placeholder="Ej. 200">
          <button class="btn-blue" onclick="modificarAgua(true)">+ Sumar</button>
          <button class="btn-red" onclick="modificarAgua(false)">- Restar</button>
          <button class="btn-blue" style="background-color: #64748b;" onclick="reiniciarAgua()">Vaciar</button>
        </div>
      </div>

      <div class="vaso-area">
        <div id="vaso" class="vaso grande">
          <div id="agua" class="contenido-agua"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Resultados fijos abajo sin el resultado de agua -->
  <div class="resultados-fijos">
    <div class="res-item">
      <div>Calorías Calculadas</div>
      <span id="totalCalorias">0 kcal</span>
    </div>
    <div class="res-item">
      <div>Registro de Consultas</div>
      <div class="consultas-lista" id="listaConsultas">Ninguna</div>
    </div>
  </div>

  <script>
    const actividades = [
      { nombre: "Caminar", detalle: "30 min", cal: 120 },
      { nombre: "Correr", detalle: "30 min", cal: 300 },
      { nombre: "Ciclismo", detalle: "45 min", cal: 350 },
      { nombre: "Natación", detalle: "30 min", cal: 250 },
      { nombre: "Saltar Cuerda", detalle: "15 min", cal: 200 },
      { nombre: "Flexiones", detalle: "50 reps", cal: 50 },
      { nombre: "Sentadillas", detalle: "50 reps", cal: 60 },
      { nombre: "Abdominales", detalle: "50 reps", cal: 40 },
      { nombre: "Yoga", detalle: "40 min", cal: 100 },
      { nombre: "Pilates", detalle: "45 min", cal: 150 },
      { nombre: "Zumba", detalle: "60 min", cal: 400 },
      { nombre: "Boxeo", detalle: "30 min", cal: 320 },
      { nombre: "Escalar", detalle: "30 min", cal: 280 },
      { nombre: "Remo", detalle: "30 min", cal: 210 },
      { nombre: "Trote suave", detalle: "20 min", cal: 160 },
      { nombre: "Pasear perro", detalle: "30 min", cal: 90 },
      { nombre: "Fútbol", detalle: "60 min", cal: 500 },
      { nombre: "Baloncesto", detalle: "45 min", cal: 380 },
      { nombre: "Tenis", detalle: "45 min", cal: 310 },
      { nombre: "Voleibol", detalle: "45 min", cal: 200 },
      { nombre: "Crossfit", detalle: "30 min", cal: 350 },
      { nombre: "Patinaje", detalle: "30 min", cal: 220 },
      { nombre: "Bailar", detalle: "30 min", cal: 180 },
      { nombre: "Burpees", detalle: "30 reps", cal: 70 },
      { nombre: "Zancadas", detalle: "40 reps", cal: 50 },
      { nombre: "Plancha", detalle: "5 min", cal: 30 },
      { nombre: "Spinning", detalle: "45 min", cal: 420 },
      { nombre: "Senderismo", detalle: "60 min", cal: 360 },
      { nombre: "Karate", detalle: "45 min", cal: 330 },
      { nombre: "Gimnasia", detalle: "45 min", cal: 240 }
    ];

    let totalCalorias = 0;
    let consultas = [];
    let capacidadMax = 2000;
    let mlActuales = 0;

    const grid = document.getElementById('gridActividades');
    actividades.forEach(act => {
      const div = document.createElement('div');
      div.className = 'actividad-item';
      div.innerHTML = `
        <span>${act.nombre} (${act.detalle})</span>
        <button class="btn-blue" onclick="sumarActividad('${act.nombre}', ${act.cal})">+${act.cal} kcal</button>
      `;
      grid.appendChild(div);
    });

    function sumarActividad(nombre, cal) {
      totalCalorias += cal;
      consultas.push(`${nombre} (${cal} kcal)`);
      actualizarResultados();
    }

    function determinarCalorias() {
      const peso = parseFloat(document.getElementById('peso').value);
      if (peso > 0) {
        alert(`Para tu peso de ${peso} kg, tus calorías base son aprox. ${Math.round(peso * 22)} kcal`);
      }
    }

    function actualizarResultados() {
      document.getElementById('totalCalorias').innerText = totalCalorias + " kcal";
      const lista = document.getElementById('listaConsultas');
      lista.innerHTML = consultas.length ? consultas.join(', ') : 'Ninguna';
    }

    function cambiarBotella(cap) {
      capacidadMax = cap;
      const vaso = document.getElementById('vaso');
      vaso.className = cap === 250 ? 'vaso pequeno' : 'vaso grande';
      actualizarAguaVisual();
    }

    function modificarAgua(esSuma) {
      const input = document.getElementById('inputMl');
      const cantidad = parseFloat(input.value);
      if (cantidad > 0) {
        if (esSuma) {
          mlActuales += cantidad;
        } else {
          mlActuales = Math.max(0, mlActuales - cantidad);
        }
        actualizarAguaVisual();
        input.value = '';
      }
    }

    function reiniciarAgua() {
      mlActuales = 0;
      actualizarAguaVisual();
    }

    function actualizarAguaVisual() {
      const agua = document.getElementById('agua');
      const vaso = document.getElementById('vaso');
      let pct = (mlActuales / capacidadMax) * 100;

      if (pct > 100) {
        agua.style.height = '100%';
        vaso.classList.add('desbordado');
      } else {
        agua.style.height = pct + '%';
        vaso.classList.remove('desbordado');
      }
    }
  </script>
</body>
</html>
